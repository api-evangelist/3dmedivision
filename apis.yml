aid: 3dmedivision
name: 3D Medivision
description: '3D Medivision (쓰리디메디비젼) is a Seoul, South Korea medical imaging and
  medical-education company founded around 3D surgical video capture. It builds 3D/2D
  camera systems, recorders and monitors that mount to surgical microscopes and endoscopes
  so a procedure can be recorded stereoscopically and streamed to surgeons in another
  room, hospital or country. On top of that hardware it operates a set of end-user
  education products: Veterflix and Global Veterflix (video-on-demand veterinary courses,
  webinars and 3D canine anatomy), VGTC (live 3D surgery streaming plus hands-on
  courses in Incheon), VET-TV (a 3D anatomy lecture system for large-group teaching),
  Veter VR (VR-based veterinary training) and Surgflix for human surgery. The company
  sells hardware, subscriptions and training — it does not operate a public developer
  program, and no public API, SDK, webhook surface or machine-readable API contract was
  found on any host it controls.'
